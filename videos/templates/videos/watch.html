<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ video.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
    <body>
        <nav class="navbar sm:navbar-expand bg-1 fg-2">
            <div class="container-fluid">
            <a class="navbar-brand" href="#">Video Streaming</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
            <div class="drawer-header">
                <h5 class="drawer-title" id="navbarNavLabel">VideoStreaming</h5>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
            </div>
            <div class="drawer-body">
                <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Movies</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Series</a>
                </li>
                </ul>
            </div>
            </dialog>
        </div>
        </nav>

        <h1>{{ video.title }}</h1>
        <p> {{ video.description }}</p>

        {% if video.hls_playlist %}
            <video id = "video-player" controls width = "800" stype = "max-width: 100%;"></video>
            <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
            <script>
                const video = document.getElementById("video-player");
                const playlistUrl = "{{ MEDIA_URL }}{{ video.hls_playlist }}";

                if(Hls.isSupported()){
                    const hls = new Hls();
                    hls.loadSource(playlistUrl);
                    hls.attachMedia(video);
                } else if(video.canPlayType("application/vnd.apple.mpegurl")){
                    video.src = playlistUrl;
                } else {
                    video.insertAdjacentText("afterend", "Your browser does not support HLS playback.");
                }
        </script>
        {% else %}
            <p> This video has not been processed for streaming yet. </p>
        {% endif %}

        <p><a href="/">Back to home</a></p>
    </body>
</html>
